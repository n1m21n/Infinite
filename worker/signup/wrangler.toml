name = "infinite-signup"
main = "index.js"
compatibility_date = "2026-10-01"

# Route the Worker on the site's own domain so the form posts a same-origin path:
# routes = [{ pattern = "infinitedevices.org/api/*", zone_name = "infinitedevices.org" }]

[[d1_databases]]
binding = "DB"
database_name = "infinite_signups"
database_id = "71e09526-debf-45b3-9fdb-4512526e77ab"   # from `npx wrangler d1 create infinite_signups`

[vars]
SITE_ORIGIN = "https://infinitedevices.org"
API_ORIGIN = "https://infinitedevices.org"
FROM = "Infinite <hello@infinitedevices.org>"
