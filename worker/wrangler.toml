name = "infinite-samples"
main = "src/index.js"
compatibility_date = "2026-10-01"

# create once with: npx wrangler kv namespace create QUOTA   (paste the id below)
[[kv_namespaces]]
binding = "QUOTA"
id = "REPLACE_WITH_KV_ID"

[vars]
FREE_PER_DAY = "10"
PRO_PER_DAY = "500"
ALLOW_ORIGIN = "https://infinitedevices.org"

# secrets, set with: npx wrangler secret put LS_API_KEY   (not needed: license validate is public)
