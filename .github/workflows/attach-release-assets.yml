name: Attach release assets

# Copies the Windows zips, the Linux AppImage and the macOS installers (Infinite.dmg, Infinite.pkg) onto a
# release, on GitHub's servers, so a slow connection on the releasing machine does not matter. Run it once
# the Build is green and the macOS installers run (macos-installers.yml) has finished.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run to take the artifacts from
        required: true
      mac_run_id:
        description: macos-installers run (leave empty if macOS installers are already uploaded to the release)
        required: false
        default: ""
      tag:
        description: Release tag (the release may still be a draft)
        required: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        run: |
          mkdir dl
          for a in Infinite-windows-x64 Infinite-windows-ARM64 Infinite-x86_64.AppImage \
                   Infinite-aarch64.AppImage Infinite-Setup-windows-x64 Infinite-Setup-windows-ARM64 \
                   Infinite-linux-x86_64.tar.gz Infinite-linux-aarch64.tar.gz \
                   ui-golden-macos ui-golden-windows ui-golden-linux; do
            gh run download "${{ inputs.run_id }}" -n "$a" -D "dl/$a" || echo "no artifact $a"
          done
          # The macOS installers come from their own run when provided.
          if [ -n "${{ inputs.mac_run_id }}" ]; then
            gh run download "${{ inputs.mac_run_id }}" -n Infinite-macos-installers -D dl/Infinite-macos-installers
            test -s dl/Infinite-macos-installers/Infinite.dmg
            test -s dl/Infinite-macos-installers/Infinite.pkg
          fi
      - name: Compare UI goldens across platforms
        run: |
          pip install --quiet pillow || python3 -m pip install --quiet pillow
          for plat in macos windows linux; do
            cand="dl/ui-golden-$plat"
            gold="tests/ui-golden/$plat"
            if [ -f "$cand/gallery-light.png" ] && [ -f "$gold/gallery-light.png" ]; then
              echo "=== Comparing $plat UI goldens ==="
              python3 tools/design/golden.py --compare "$cand" "$gold"
            else
              echo "=== Skipping $plat UI goldens (artifact or committed golden absent) ==="
            fi
          done
      - name: Zip the Windows builds
        run: |
          for arch in x64 ARM64; do
            mkdir -p "stage-$arch/Infinite"
            cp -R "dl/Infinite-windows-$arch"/. "stage-$arch/Infinite/"
            (cd "stage-$arch" && zip -qr "../Infinite-windows-$arch.zip" Infinite)
          done
      - name: Upload to the release
        run: |
          ASSETS=(
            Infinite-windows-x64.zip
            Infinite-windows-ARM64.zip
            dl/Infinite-x86_64.AppImage/Infinite-x86_64.AppImage
            dl/Infinite-Setup-windows-x64/Infinite-Setup-windows-x64.exe
            dl/Infinite-linux-x86_64.tar.gz/Infinite-linux-x86_64.tar.gz
          )
          if [ -n "${{ inputs.mac_run_id }}" ]; then
            ASSETS+=(dl/Infinite-macos-installers/Infinite.dmg dl/Infinite-macos-installers/Infinite.pkg)
          fi
          gh release upload "${{ inputs.tag }}" "${ASSETS[@]}" --clobber
          # Best-effort preview builds: attach when built.
          for opt in Infinite-Setup-windows-ARM64/Infinite-Setup-windows-ARM64.exe \
                     Infinite-aarch64.AppImage/Infinite-aarch64.AppImage \
                     Infinite-linux-aarch64.tar.gz/Infinite-linux-aarch64.tar.gz; do
            if [ -f "dl/$opt" ]; then
              gh release upload "${{ inputs.tag }}" "dl/$opt" --clobber
            fi
          done
