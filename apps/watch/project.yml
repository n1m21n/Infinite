# XcodeGen spec for "Infinite Remote", the watchOS app that sends the watch's motion to Infinite on the Mac.
# The .xcodeproj is generated (scripts/build_watch_app.sh runs `xcodegen`) and is not committed.
name: InfiniteRemote
options:
  bundleIdPrefix: org.infinitedevices
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Watch.xcconfig
  Release: Config/Watch.xcconfig
targets:
  InfiniteRemote:
    type: application
    platform: watchOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Signing team, bundle id and the HealthKit switch come from Config/Local.xcconfig (see README.md).
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Infinite Remote
        WKApplication: true
        WKWatchOnly: true
        NSMotionUsageDescription: Infinite Remote sends your wrist motion to Infinite on your Mac.
        NSBluetoothAlwaysUsageDescription: Infinite Remote connects to Infinite on your Mac over Bluetooth.
        NSHealthShareUsageDescription: Infinite Remote reads your heart rate to send it to Infinite (only with INFINITE_WATCH_HEALTH=1).
        NSHealthUpdateUsageDescription: Infinite Remote keeps a workout session open so the sensors keep running (only with INFINITE_WATCH_HEALTH=1).
        WKBackgroundModes:
          - physical-therapy
          - workout-processing
  InfiniteRemoteTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: Tests
        excludes:
          - golden_main.swift
    dependencies:
      - target: InfiniteRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(INFINITE_BUNDLE_PREFIX).infiniteremote.tests
schemes:
  InfiniteRemote:
    build:
      targets:
        InfiniteRemote: all
    test:
      targets:
        - InfiniteRemoteTests
