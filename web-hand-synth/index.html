<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Hand Tracking Synth</title>
    <link rel="stylesheet" href="style.css">
    <!-- MediaPipe CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Hidden Video element for webcam capture -->
    <video id="webcam-video" style="display: none;" playsinline muted></video>

    <!-- App Layout: Left Stage + Minimal Right Panel -->
    <div class="app-container">
        <!-- Left: Clean Immersive Canvas -->
        <main class="canvas-stage">
            <canvas id="main-canvas" width="1280" height="720"></canvas>
        </main>

        <!-- Right: Minimal Control Panel -->
        <aside class="right-panel">
            <!-- Header -->
            <div class="panel-header">
                <div class="panel-title">Thermal Synth</div>
                <div class="status-badge">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="status-text">Standby</span>
                </div>
            </div>

            <!-- Heatmap Palettes Section -->
            <div class="panel-section">
                <div class="section-label">Heatmap Palette</div>
                <div class="palette-list">
                    <button class="palette-item active" data-palette="ironbow">
                        <div class="palette-left">
                            <span class="color-strip strip-ironbow"></span>
                            <span>Ironbow FLIR</span>
                        </div>
                        <span class="key-badge">1</span>
                    </button>
                    <button class="palette-item" data-palette="magma">
                        <div class="palette-left">
                            <span class="color-strip strip-magma"></span>
                            <span>Magma Glow</span>
                        </div>
                        <span class="key-badge">2</span>
                    </button>
                    <button class="palette-item" data-palette="cyberpunk">
                        <div class="palette-left">
                            <span class="color-strip strip-cyberpunk"></span>
                            <span>Cyberpunk</span>
                        </div>
                        <span class="key-badge">3</span>
                    </button>
                    <button class="palette-item" data-palette="turbo">
                        <div class="palette-left">
                            <span class="color-strip strip-turbo"></span>
                            <span>Turbo Spectral</span>
                        </div>
                        <span class="key-badge">4</span>
                    </button>
                    <button class="palette-item" data-palette="inferno">
                        <div class="palette-left">
                            <span class="color-strip strip-inferno"></span>
                            <span>Inferno Solar</span>
                        </div>
                        <span class="key-badge">5</span>
                    </button>
                    <button class="palette-item" data-palette="viridis">
                        <div class="palette-left">
                            <span class="color-strip strip-viridis"></span>
                            <span>Viridis Deep</span>
                        </div>
                        <span class="key-badge">6</span>
                    </button>
                    <button class="palette-item" data-palette="acid">
                        <div class="palette-left">
                            <span class="color-strip strip-acid"></span>
                            <span>Acid Emerald</span>
                        </div>
                        <span class="key-badge">7</span>
                    </button>
                    <button class="palette-item" data-palette="ice_fire">
                        <div class="palette-left">
                            <span class="color-strip strip-ice_fire"></span>
                            <span>Ice & Fire</span>
                        </div>
                        <span class="key-badge">8</span>
                    </button>
                </div>
            </div>

            <!-- Engine Controls Section -->
            <div class="panel-section">
                <div class="section-label">Controls</div>
                <div class="action-grid">
                    <button id="btn-camera" class="btn-action btn-full">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                        Start Camera
                    </button>
                    <button id="btn-audio" class="btn-action">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                        Audio
                    </button>
                    <button id="btn-flip" class="btn-action active">
                        Mirror
                    </button>
                    <button id="btn-skeleton" class="btn-action active btn-full">
                        Hand Skeleton
                    </button>
                </div>
            </div>

            <!-- Minimal Footer Shortcuts -->
            <div class="panel-footer">
                <div class="footer-row">
                    <span>Cycle Palette</span>
                    <span>[SPACE]</span>
                </div>
                <div class="footer-row">
                    <span>Mute Audio</span>
                    <span>[M]</span>
                </div>
                <div class="footer-row">
                    <span>X Axis</span>
                    <span>Pitch / Freq</span>
                </div>
                <div class="footer-row">
                    <span>Y Axis</span>
                    <span>Filter Cutoff</span>
                </div>
            </div>
        </aside>
    </div>

    <!-- Application Engine Scripts -->
    <script src="audio-engine.js"></script>
    <script src="video-filters.js"></script>
    <script src="app.js"></script>
</body>
</html>
