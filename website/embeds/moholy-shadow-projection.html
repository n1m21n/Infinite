  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl");

    const vsSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fsSource = `
precision highp float;
uniform vec2 res;
uniform float t;
uniform float aspect;
uniform float audio_bass;
uniform float audio_mid;
uniform float audio_high;

void main() {
  vec2 uv = gl_FragCoord.xy / res;
  vec2 p = vec2((uv.x - 0.5) * aspect, uv.y - 0.5);
  float r = length(p);

  float ang = t * 0.35 + audio_mid * 0.6;
  float c1 = cos(ang), s1 = sin(ang);
  vec2 p1 = vec2(p.x * c1 - p.y * s1, p.x * s1 + p.y * c1);
  vec2 cell = fract(p1 * (12.0 + audio_bass * 3.0)) - 0.5;
  float hole = smoothstep(0.32, 0.24, length(cell));
  float disc = smoothstep(0.42 + audio_bass * 0.04, 0.40, r) * (1.0 - hole * 0.85);

  float ang2 = -0.48 + t * 0.18 - audio_high * 0.4;
  float c2 = cos(ang2), s2 = sin(ang2);
  float x2 = p.x * c2 - p.y * s2;
  float grate = smoothstep(0.35, 0.75, sin(x2 * 56.0));

  float cone = smoothstep(0.65, -0.2, dot(p, normalize(vec2(0.7, -0.7)))) * (0.45 + 0.55 * (1.0 - grate * 0.6));
  float ring = smoothstep(0.012, 0.0, abs(r - (0.40 + audio_bass * 0.03)));

  vec3 cSlate = vec3(0.043, 0.047, 0.063);
  vec3 cSteel = vec3(0.784, 0.800, 0.831);
  vec3 cAmber = vec3(0.910, 0.659, 0.314);

  vec3 col = cSlate;
  col = mix(col, cAmber * (0.72 + audio_high * 0.35), clamp(cone * (1.0 - disc * 0.72), 0.0, 1.0));
  col = mix(col, cSteel, clamp(ring + disc * grate * 0.35, 0.0, 1.0));
  gl_FragColor = vec4(col, 1.0);
}
`;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    const resLoc = gl.getUniformLocation(program, "res");
    const tLoc = gl.getUniformLocation(program, "t");
    const aspectLoc = gl.getUniformLocation(program, "aspect");
    const bassLoc = gl.getUniformLocation(program, "audio_bass");
    const midLoc = gl.getUniformLocation(program, "audio_mid");
    const highLoc = gl.getUniformLocation(program, "audio_high");

    let audioBass = 0.0, audioMid = 0.0, audioHigh = 0.0;
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "infinite_audio") {
        audioBass = e.data.bass || 0.0;
        audioMid = e.data.mid || 0.0;
        audioHigh = e.data.high || 0.0;
      }
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resize);
    resize();

    const start = performance.now();
    function render(now) {
      const t = (now - start) * 0.001;
      gl.uniform2f(resLoc, canvas.width, canvas.height);
      gl.uniform1f(tLoc, t);
      gl.uniform1f(aspectLoc, canvas.width / Math.max(1.0, canvas.height));
      gl.uniform1f(bassLoc, audioBass);
      gl.uniform1f(midLoc, audioMid);
      gl.uniform1f(highLoc, audioHigh);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
