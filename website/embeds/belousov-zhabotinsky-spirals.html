  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl");

    const vsSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fsSource = `
precision mediump float;
uniform vec2 res;
uniform float t;
uniform float aspect;
uniform float audio_bass;
uniform float audio_mid;
uniform float audio_high;

void main() {
  vec2 uv = gl_FragCoord.xy / res;
  vec2 p = vec2((uv.x - 0.5) * aspect, uv.y - 0.5);
  float rDish = length(p);

  float curlWarp = 0.24 + audio_mid * 0.18;
  vec2 w1 = vec2(sin(p.y * 9.5 + t * 0.35), cos(p.x * 9.5 - t * 0.30)) * curlWarp * 0.18;
  vec2 w2 = vec2(cos(p.y * 17.0 - t * 0.45), sin(p.x * 16.0 + t * 0.40)) * curlWarp * 0.08;
  vec2 q = p + w1 + w2;

  vec2 c1 = q - vec2(-0.14, 0.08);
  vec2 c2 = q - vec2(0.15, -0.09);
  vec2 c3 = q - vec2(-0.02, -0.17);

  float a1 = atan(c1.y, c1.x);
  float a2 = atan(c2.y, c2.x);
  float a3 = atan(c3.y, c3.x);

  float waveFreq = 18.0 + audio_bass * 4.5;
  float speed = 1.6 + audio_bass * 0.8;
  float ph1 = length(c1) * waveFreq - t * speed + 3.0 * a1;
  float ph2 = length(c2) * waveFreq * 1.08 - t * speed * 1.12 - 2.0 * a2;
  float ph3 = length(c3) * waveFreq * 0.94 - t * speed * 0.92 + 2.0 * a3;

  float u1 = fract(ph1 / 6.2831853);
  float u2 = fract(ph2 / 6.2831853);
  float u3 = fract(ph3 / 6.2831853);
  float f1 = smoothstep(0.0, 0.16, u1) * (1.0 - smoothstep(0.16, 0.85, u1));
  float f2 = smoothstep(0.0, 0.18, u2) * (1.0 - smoothstep(0.18, 0.85, u2));
  float f3 = smoothstep(0.0, 0.17, u3) * (1.0 - smoothstep(0.17, 0.85, u3));

  float wave = max(f1, max(f2, f3));
  float crest = pow(wave, 1.4);

  vec3 cMaroon = vec3(0.235, 0.078, 0.078);
  vec3 cFerroin = vec3(0.545, 0.180, 0.165);
  vec3 cIndigo = vec3(0.353, 0.424, 0.557);
  vec3 cSilver = vec3(0.667, 0.745, 0.831) * (1.0 + audio_high * 0.25);

  float dishRadius = 0.44;
  float bgRad = smoothstep(0.0, dishRadius, rDish);
  vec3 dishCol = mix(cFerroin, cMaroon, bgRad * 0.85);
  dishCol = mix(dishCol, cIndigo, smoothstep(0.18, 0.72, wave));
  dishCol = mix(dishCol, cSilver, smoothstep(0.68, 0.98, crest));

  float inDish = 1.0 - smoothstep(dishRadius - 0.008, dishRadius + 0.004, rDish);
  float rim = smoothstep(dishRadius - 0.014, dishRadius, rDish) * (1.0 - smoothstep(dishRadius, dishRadius + 0.022, rDish));
  vec3 cTable = vec3(0.125, 0.118, 0.114);
  vec3 cGlass = vec3(0.76, 0.82, 0.80);

  vec3 col = mix(cTable, dishCol, inDish);
  col = mix(col, cGlass, rim * 0.72);
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    const resLoc = gl.getUniformLocation(program, "res");
    const tLoc = gl.getUniformLocation(program, "t");
    const aspectLoc = gl.getUniformLocation(program, "aspect");
    const bassLoc = gl.getUniformLocation(program, "audio_bass");
    const midLoc = gl.getUniformLocation(program, "audio_mid");
    const highLoc = gl.getUniformLocation(program, "audio_high");

    let audioBass = 0.0, audioMid = 0.0, audioHigh = 0.0;
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "infinite_audio") {
        audioBass = e.data.bass || 0.0;
        audioMid = e.data.mid || 0.0;
        audioHigh = e.data.high || 0.0;
      }
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resize);
    resize();

    const startTime = performance.now();
    function render(now) {
      const t = (now - startTime) * 0.001;
      gl.uniform2f(resLoc, canvas.width, canvas.height);
      gl.uniform1f(tLoc, t);
      gl.uniform1f(aspectLoc, canvas.width / Math.max(1, canvas.height));
      const b = audioBass || (0.28 + 0.22 * Math.sin(t * 2.1));
      const m = audioMid  || (0.22 + 0.16 * Math.cos(t * 1.4));
      const h = audioHigh || (0.18 + 0.14 * Math.sin(t * 3.7));
      gl.uniform1f(bassLoc, b);
      gl.uniform1f(midLoc, m);
      gl.uniform1f(highLoc, h);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
