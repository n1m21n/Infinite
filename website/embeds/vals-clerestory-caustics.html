  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl");

    const vsSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fsSource = `
precision highp float;
uniform vec2 res;
uniform float t;
uniform float aspect;
uniform float audio_bass;
uniform float audio_mid;
uniform float audio_high;

void main() {
  vec2 uv = gl_FragCoord.xy / res;
  vec2 p = vec2((uv.x - 0.5) * aspect, uv.y - 0.5);

  float row = floor(uv.y * 22.0);
  float joint = smoothstep(0.04, 0.14, fract(uv.y * 22.0));
  float vein = 0.5 + 0.5 * sin(uv.x * 14.0 + row * 2.1 + sin(uv.x * 5.0 - t * 0.25) * 1.4);
  float stone = mix(0.18, 0.36, vein) * joint;

  float waterMask = smoothstep(0.42 + audio_bass * 0.06, 0.28, uv.y);
  float warp = sin(p.x * 16.0 + t * 0.9 + audio_mid * 1.2) * cos(p.y * 22.0 - t * 0.7);
  float caustic = pow(0.5 + 0.5 * sin((p.x + warp * (0.08 + audio_high * 0.05)) * 28.0 + t * 1.2), 3.0) * waterMask;

  float slit1 = exp(-abs(p.x + 0.18) * (18.0 - audio_bass * 4.0)) * smoothstep(-0.45, 0.45, p.y + 0.25);
  float slit2 = exp(-abs(p.x - 0.22) * (22.0 - audio_mid * 4.0)) * smoothstep(-0.35, 0.45, p.y + 0.15);
  float slit = clamp(slit1 + slit2, 0.0, 1.0);

  vec3 cCharcoal = vec3(0.110, 0.125, 0.141);
  vec3 cSlate = vec3(0.42, 0.46, 0.49);
  vec3 cTeal = vec3(0.239, 0.471, 0.502);
  vec3 cBeam = vec3(0.851, 0.796, 0.710);

  vec3 col = mix(cCharcoal, cSlate, stone);
  col = mix(col, cTeal * (0.7 + (0.7 + audio_high * 0.6) * caustic), clamp(waterMask * 0.85, 0.0, 1.0));
  col = mix(col, cBeam * (1.0 + audio_bass * 0.25), clamp(slit * 0.78, 0.0, 1.0));
  gl_FragColor = vec4(col, 1.0);
}
`;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    const resLoc = gl.getUniformLocation(program, "res");
    const tLoc = gl.getUniformLocation(program, "t");
    const aspectLoc = gl.getUniformLocation(program, "aspect");
    const bassLoc = gl.getUniformLocation(program, "audio_bass");
    const midLoc = gl.getUniformLocation(program, "audio_mid");
    const highLoc = gl.getUniformLocation(program, "audio_high");

    let audioBass = 0.0, audioMid = 0.0, audioHigh = 0.0;
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "infinite_audio") {
        audioBass = e.data.bass || 0.0;
        audioMid = e.data.mid || 0.0;
        audioHigh = e.data.high || 0.0;
      }
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resize);
    resize();

    const start = performance.now();
    function render(now) {
      const t = (now - start) * 0.001;
      gl.uniform2f(resLoc, canvas.width, canvas.height);
      gl.uniform1f(tLoc, t);
      gl.uniform1f(aspectLoc, canvas.width / Math.max(1.0, canvas.height));
      gl.uniform1f(bassLoc, audioBass);
      gl.uniform1f(midLoc, audioMid);
      gl.uniform1f(highLoc, audioHigh);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
