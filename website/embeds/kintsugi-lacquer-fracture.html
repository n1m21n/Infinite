  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl");
    if (!gl) { document.body.innerHTML = '<p class="fallback">This visual needs WebGL, which this browser does not offer.</p>'; }

    const vsSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fsSource = `
precision highp float;
uniform vec2 res;
uniform float t;
uniform float aspect;
uniform float audio_bass;
uniform float audio_mid;
uniform float audio_high;

void main() {
  vec2 uv = gl_FragCoord.xy / res;
  vec2 p = vec2((uv.x - 0.5) * aspect, uv.y - 0.5) * 3.2;

  vec2 q = p + (0.24 + audio_bass * 0.06) * vec2(sin(p.y * 2.3 + t * 0.18), cos(p.x * 2.1 - t * 0.15));
  q = q + (0.10 + audio_mid * 0.05) * vec2(cos(q.y * 5.7 - t * 0.22), sin(q.x * 5.1 + t * 0.19));

  float v1 = abs(sin(q.x * 2.2 + sin(q.y * 1.9)) + cos(q.y * 2.5 - cos(q.x * 1.7)));
  float v2 = abs(sin((q.x + q.y) * 1.85) - cos((q.x - q.y) * 2.15));
  float crack = min(v1, v2);

  float speck = 0.5 + 0.5 * sin(p.x * 24.0) * cos(p.y * 24.0);
  vec3 cUrushi = mix(vec3(0.09, 0.08, 0.08), vec3(0.22, 0.14, 0.11), speck * 0.65);
  vec3 cKiln = vec3(0.38, 0.18, 0.12);
  vec3 body = mix(cUrushi, cKiln, smoothstep(0.35, 1.35, v1) * 0.45);

  float seam = exp(-crack * (22.0 - audio_high * 5.5));
  float goldHalo = exp(-crack * 5.5) * (0.45 + audio_bass * 0.35);
  float shimmer = 0.85 + 0.15 * sin(p.x * 18.0 + p.y * 14.0 + t * 1.5);
  vec3 cGold = vec3(0.95, 0.75, 0.28) * shimmer * (1.0 + audio_high * 0.35);
  vec3 cAmber = vec3(0.68, 0.44, 0.14);

  vec3 col = mix(body, cAmber, goldHalo);
  col = mix(col, cGold, clamp(seam * 1.25, 0.0, 1.0));
  gl_FragColor = vec4(col, 1.0);
}
`;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    const resLoc = gl.getUniformLocation(program, "res");
    const tLoc = gl.getUniformLocation(program, "t");
    const aspectLoc = gl.getUniformLocation(program, "aspect");
    const bassLoc = gl.getUniformLocation(program, "audio_bass");
    const midLoc = gl.getUniformLocation(program, "audio_mid");
    const highLoc = gl.getUniformLocation(program, "audio_high");

    let audioBass = 0.0, audioMid = 0.0, audioHigh = 0.0, analyser = null, freqData = null;
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "infinite_audio") {
        audioBass = e.data.bass || 0.0;
        audioMid = e.data.mid || 0.0;
        audioHigh = e.data.high || 0.0;
      }
    });
    const btnAudio = document.getElementById("btn-audio");
    if (btnAudio) {
      btnAudio.addEventListener("click", async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const src = ctx.createMediaStreamSource(stream);
          analyser = ctx.createAnalyser();
          analyser.fftSize = 256;
          src.connect(analyser);
          freqData = new Uint8Array(analyser.frequencyBinCount);
          btnAudio.classList.add("on");
          btnAudio.setAttribute("aria-label", "Microphone on");
        } catch (_) {
          btnAudio.classList.add("off");
          btnAudio.setAttribute("aria-label", "Microphone blocked");
        }
      });
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resize);
    resize();

    const start = performance.now();
    function render(now) {
      const t = (now - start) * 0.001;
      if (analyser && freqData) {
        analyser.getByteFrequencyData(freqData);
        let b = 0, m = 0, h = 0;
        for (let i = 0; i < 6; i++) b += freqData[i];
        for (let i = 6; i < 28; i++) m += freqData[i];
        for (let i = 28; i < 80; i++) h += freqData[i];
        audioBass = b / (6 * 255);
        audioMid = m / (22 * 255);
        audioHigh = h / (52 * 255);
      }
      gl.uniform2f(resLoc, canvas.width, canvas.height);
      gl.uniform1f(tLoc, t);
      gl.uniform1f(aspectLoc, canvas.width / Math.max(1.0, canvas.height));
      gl.uniform1f(bassLoc, audioBass);
      gl.uniform1f(midLoc, audioMid);
      gl.uniform1f(highLoc, audioHigh);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
