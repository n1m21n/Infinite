<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite — Artworks</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #000;
      color: #fff;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Seamless Borderless Artworks Grid */
    .artworks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 0;
      width: 100vw;
      min-height: 100vh;
      padding: 0;
      margin: 0;
      border: none;
      outline: none;
      background: #000;
    }

    @media (min-width: 1920px) {
      .artworks-grid {
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      }
    }

    @media (max-width: 768px) {
      .artworks-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }

    @media (max-width: 480px) {
      .artworks-grid {
        grid-template-columns: 1fr;
      }
    }

    .art-cell {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #000;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
    }

    .art-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
      background: #000;
      transition: transform 0.4s ease;
    }

    .art-cell:hover .art-video {
      transform: scale(1.02);
    }

    /* Subtle Floating Navigation Button */
    .floating-back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 16, 14, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.25s ease, background 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
      cursor: pointer;
    }

    .floating-back-btn:hover {
      opacity: 1;
      background: rgba(26, 23, 20, 0.95);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
      color: #fff;
    }

    .floating-back-btn svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>

  <!-- Floating Back Button to Return to Home -->
  <a href="index.html" class="floating-back-btn" title="Back to Infinite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Infinite</span>
  </a>

  <!-- Pure Borderless Video Artworks Grid -->
  <main class="artworks-grid">
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_01.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_02.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_03.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_04.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_05.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_06.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_07.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_08.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_09.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_10.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_11.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_12.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_13.mp4" autoplay loop muted playsinline preload="auto"></video></div>
    <div class="art-cell"><video class="art-video" src="assets/artworks/artwork_14.mp4" autoplay loop muted playsinline preload="auto"></video></div>
  </main>

  <script>
    // Ensure all videos play continuously
    document.addEventListener('DOMContentLoaded', () => {
      const videos = document.querySelectorAll('video');
      videos.forEach(v => {
        v.play().catch(() => {});
      });

      // Press ESC to return to main page
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.location.href = 'index.html';
        }
      });
    });
  </script>
</body>
</html>
