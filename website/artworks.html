<body class="is-loading">

  <h1 class="sr-only">Infinite — Artworks</h1>

  <canvas id="stage" aria-label="Interactive 3D gallery of artworks made with Infinite"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Opening title -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-eyebrow">Infinite</div>
    <div class="intro-title">Artworks</div>
    <div class="intro-bar"><i id="introBar"></i></div>
  </div>

  <!-- Chrome -->
  <a href="index.html" class="chip back" title="Back to Infinite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    <span>Infinite</span>
  </a>

  <div class="counter chip" id="counter" aria-live="polite"><span id="counterNo">01</span><em>/</em><span id="counterTotal">9</span></div>

  <nav class="modes" id="modes" aria-label="View">
    <i class="thumb" id="modeThumb"></i>
    <button data-mode="hall" class="on" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4l6 5v6l-6 5zM21 4l-6 5v6l6 5z"/><rect x="9" y="9" width="6" height="6"/></svg>
      <span>Hall</span>
    </button>
    <button data-mode="rotunda" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/><path d="M12 3.5v2.6M12 17.9v2.6M3.5 12h2.6M17.9 12h2.6"/></svg>
      <span>Rotunda</span>
    </button>
    <button data-mode="wall" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="7" height="9" rx="1"/><rect x="13" y="4" width="8" height="5" rx="1"/><rect x="13" y="12" width="8" height="8" rx="1"/><rect x="3" y="16" width="7" height="4" rx="1"/></svg>
      <span>Wall</span>
    </button>
  </nav>

  <p class="hint" id="hint"></p>

  <!-- Close-up -->
  <aside class="plaque" id="plaque" aria-live="polite">
    <div class="plaque-no" id="plaqueNo">No. 01</div>
    <div class="plaque-title" id="plaqueTitle">Untitled</div>
    <div class="plaque-meta" id="plaqueMeta">Infinite, 2026</div>
  </aside>
  <div class="focus-ui" id="focusUi">
    <button class="round" id="prevBtn" aria-label="Previous artwork"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button class="round" id="nextBtn" aria-label="Next artwork"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    <button class="round close" id="closeBtn" aria-label="Back to the gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
  </div>

  <!-- Crawlable / no-WebGL gallery (same pieces) -->
  <section class="plain" id="plain" aria-label="Artworks">
    <figure><img src="assets/museum/01.jpg" alt="Infinite artwork 1: a glitched water tower in a pastel landscape" loading="lazy" width="720" height="960"></figure>
    <figure><img src="assets/museum/02.jpg" alt="Infinite artwork 3: a portrait tiled and mirrored in electric blue" loading="lazy" width="720" height="960"></figure>
    <figure><img src="assets/museum/06.jpg" alt="Infinite artwork 4: a mushroom and fairy in glowing neon pattern on black" loading="lazy" width="720" height="960"></figure>
    <figure><img src="assets/museum/04.jpg" alt="Infinite artwork 5: a dodecahedron of text above green hills" loading="lazy" width="720" height="960"></figure>
    <figure><img src="assets/museum/05.jpg" alt="Infinite artwork 6: pink and orange glitched collage with bold type" loading="lazy" width="720" height="960"></figure>
    <figure><img src="assets/museum/07.jpg" alt="Infinite artwork 7: a checkerboard warp with chrome shapes" loading="lazy" width="720" height="960"></figure>
    <figure><img src="assets/museum/08.jpg" alt="Infinite artwork 8: a red halftone face with blue beads" loading="lazy" width="720" height="960"></figure>
    <figure><img src="assets/museum/09.jpg" alt="Infinite artwork 9: a glitched olive landscape with a pale sphere" loading="lazy" width="720" height="960"></figure>
    <figure><img src="assets/museum/10.jpg" alt="Infinite artwork 10: a rainbow spiral with the words distortion is sexy" loading="lazy" width="720" height="960"></figure>
  </section>
