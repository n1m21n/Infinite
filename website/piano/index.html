  <div id="world" class="world" aria-hidden="true"></div>

  <header class="top">
    <a class="brand glass" href="../" aria-label="Infinite home">
      <img src="../assets/favicon.svg" alt="" width="24" height="24">
      <span class="brand-name">Infinite</span>
      <span class="folio">Nocturne</span>
    </a>
    <p class="readout glass" id="readout">
      <span id="hud-key">D dorian</span><span id="hud-chord">Dm9</span><span id="hud-bpm">60 BPM</span>
    </p>
    <div class="top-actions glass">
      <button type="button" class="icon-btn" id="btn-patch" aria-label="Show patch" data-tip="Patch"><svg><use href="#i-code"/></svg></button>
      <button type="button" class="icon-btn" id="btn-hide" aria-label="Hide controls" aria-pressed="false" data-tip="Hide"><svg><use href="#i-eye"/></svg></button>
    </div>
  </header>

  <canvas id="ribbon" class="ribbon" height="28" aria-label="Piano keys. Click a key to play it."></canvas>

  <nav class="dock glass" aria-label="Nocturne controls">
    <button type="button" class="icon-btn is-primary" id="btn-play" aria-label="Play" data-tip="Play"><svg><use id="play-icon" href="#i-play"/></svg></button>
    <span class="dock-gap" aria-hidden="true"></span>
    <button type="button" class="icon-btn" data-pop="pop-voice" aria-expanded="false" aria-controls="pop-voice" aria-label="Voice" data-tip="Voice"><svg><use href="#i-piano"/></svg></button>
    <button type="button" class="icon-btn" data-pop="pop-feel" aria-expanded="false" aria-controls="pop-feel" aria-label="Feel" data-tip="Feel"><svg><use href="#i-mixer"/></svg></button>
    <button type="button" class="icon-btn" data-pop="pop-ambience" aria-expanded="false" aria-controls="pop-ambience" aria-label="Ambience" data-tip="Ambience"><svg><use href="#i-waveform"/></svg></button>
    <span class="dock-gap" aria-hidden="true"></span>
    <button type="button" class="icon-btn" id="btn-like" aria-label="Like this phrase" data-tip="Like"><svg><use id="like-icon" href="#i-star"/></svg></button>
    <button type="button" class="icon-btn" id="btn-next" aria-label="Next phrase" data-tip="Next"><svg><use href="#i-refresh"/></svg></button>
    <span class="dock-gap" aria-hidden="true"></span>
    <button type="button" class="icon-btn" id="btn-sky" aria-label="Switch to sunset" data-tip="Sunset"><svg><use id="sky-icon" href="#i-sun"/></svg></button>
  </nav>

  <section class="pop" id="pop-voice" role="dialog" aria-label="Voice" hidden>
    <h2 class="pop-title">Voice</h2>
    <div class="chips" role="radiogroup" aria-label="Piano voice">
      <button type="button" class="chip" role="radio" aria-checked="true" data-model="felt">Felt</button>
      <button type="button" class="chip" role="radio" aria-checked="false" data-model="grand">Grand</button>
      <button type="button" class="chip" role="radio" aria-checked="false" data-model="dark_grand">Dark grand</button>
      <button type="button" class="chip" role="radio" aria-checked="false" data-model="rhodes">Rhodes</button>
    </div>
  </section>

  <section class="pop" id="pop-feel" role="dialog" aria-label="Feel" hidden>
    <h2 class="pop-title">Feel</h2>
    <label class="row"><span>Smooth</span><input type="range" id="s-smooth" min="0" max="100" value="80"><output>80</output></label>
    <label class="row"><span>Soothe</span><input type="range" id="s-soothe" min="0" max="100" value="84"><output>84</output></label>
    <label class="row"><span>Space</span><input type="range" id="s-space" min="0" max="100" value="76"><output>76</output></label>
    <label class="row"><span>Range</span><input type="range" id="s-range" min="15" max="100" value="90"><output>90</output></label>
    <div class="row row-selects">
      <label><span class="sr">Key</span>
        <select id="sel-key">
          <option value="-1">Auto key</option><option value="0">C</option><option value="2" selected>D</option>
          <option value="3">E♭</option><option value="4">E</option><option value="5">F</option><option value="6">F♯</option>
          <option value="7">G</option><option value="9">A</option><option value="10">B♭</option>
        </select>
      </label>
      <label><span class="sr">Scale</span>
        <select id="sel-scale">
          <option value="auto">Auto scale</option><option value="dorian" selected>Dorian</option><option value="minor">Aeolian</option>
          <option value="major">Major</option><option value="lydian">Lydian</option><option value="harmonic minor">Harmonic minor</option>
          <option value="maj_pent">Pentatonic</option>
        </select>
      </label>
    </div>
  </section>

  <section class="pop" id="pop-ambience" role="dialog" aria-label="Ambience" hidden>
    <h2 class="pop-title">Ambience</h2>
    <div class="chips" role="radiogroup" aria-label="Scene">
      <button type="button" class="chip" role="radio" aria-checked="true" data-scene="midnight_grove">Grove</button>
      <button type="button" class="chip" role="radio" aria-checked="false" data-scene="rainy_vinyl">Rain</button>
      <button type="button" class="chip" role="radio" aria-checked="false" data-scene="pebble_cove">Cove</button>
      <button type="button" class="chip" role="radio" aria-checked="false" data-scene="cozy_cafe">Café</button>
      <button type="button" class="chip" role="radio" aria-checked="false" data-scene="deep_zen">Zen</button>
      <button type="button" class="chip" role="radio" aria-checked="false" data-scene="clear">Off</button>
    </div>
    <details class="mix">
      <summary>Mix</summary>
      <div class="mix-grid" id="mix-grid"></div>
      <div class="chips chips-small" role="radiogroup" aria-label="Noise colour">
        <button type="button" class="chip" role="radio" aria-checked="true" data-noise="pink">Pink</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-noise="brown">Brown</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-noise="velvet">Velvet</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-noise="white">White</button>
      </div>
    </details>
  </section>

  <div class="intro" id="intro">
    <p class="folio">Infinite · Nocturne</p>
    <h1>Nocturne</h1>
    <p class="lead">An endless piano piece in a landscape you can walk through.</p>
    <button type="button" class="btn-primary" id="btn-enter"><svg><use href="#i-play"/></svg><span>Play</span></button>
    <button type="button" class="btn-quiet" id="btn-look">Look around</button>
    <p class="load" id="load" role="status">Loading 0%</p>
  </div>

  <p class="toast glass" id="toast" role="status" hidden></p>

  <dialog class="patch" id="patch">
    <header>
      <h2>Patch</h2>
      <button type="button" class="icon-btn" id="btn-patch-close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </header>
    <p class="patch-meta" id="patch-meta">PianoNode</p>
    <pre id="patch-code" tabindex="0">Press play to grow a patch.</pre>
    <button type="button" class="btn-secondary" id="btn-download">Download .inf</button>
  </dialog>

  <script src="./ambient-engine.js?v=2"></script>
  <script src="./piano-engine.js?v=2"></script>
  <script type="module" src="./app.js?v=3"></script>
</body>
