<main>
    <section class="section blog-hero">
      <div class="blog-head-bar">
        <h1 class="slab">Samples</h1>
        <div class="blog-toolbar">
          <button class="smp-pill" data-view="swipe" aria-pressed="true" type="button">Swipe</button>
          <button class="smp-pill" data-view="list" aria-pressed="false" type="button">List</button>
          <button class="smp-pill" id="smp-shuffle" type="button">Shuffle</button>
        </div>
      </div>
      <p class="smp-lede">Every sound and picture here was made by a patch that Infinite generated by itself, then rendered by the real engine. Listen, rate what you like, and download the patch to open it in Infinite.</p>
      <div class="smp-bar">
        <button class="smp-pill" data-filter="all" aria-pressed="true" type="button">All</button>
        <button class="smp-pill" data-filter="A" aria-pressed="false" type="button">Audio</button>
        <button class="smp-pill" data-filter="V" aria-pressed="false" type="button">Visual</button>
        <button class="smp-pill" data-filter="AV" aria-pressed="false" type="button">Audio + visual</button>
        <span class="grow"></span>
        <span class="smp-count" id="smp-total"></span>
        <span class="smp-count" id="smp-rated"></span>
        <button class="smp-pill" id="smp-export" type="button">Export ratings</button>
      </div>
      <div id="smp-swipe">
        <div class="smp-stage" id="smp-stage"></div>
        <div class="smp-nav" style="max-width:760px;margin:12px auto 0">
          <button class="smp-pill" id="smp-prev" type="button">← Previous</button>
          <span class="smp-count" id="smp-pos" style="align-self:center"></span>
          <button class="smp-pill" id="smp-next" type="button">Next →</button>
        </div>
        <p class="smp-hint">swipe or use ← → · space plays · 1–5 rates</p>
      </div>
      <div class="smp-list" id="smp-list" hidden></div>
    </section>
  </main>
